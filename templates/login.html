
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MiniSklad</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            color: #202b3c;
        }

        .login-card {
            width: 100%;
            max-width: 390px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px #1d2c4412;
        }

        h1 { margin-top: 0; font-size: 26px; }
        p { color: #68758a; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6dce5;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #315ee7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            padding: 10px;
            border-radius: 8px;
            background: #fff0f0;
            color: #b42318;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>MiniSklad</h1>
        <p>Войдите в систему управления складом.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="username">Логин</label>
            <input
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">Пароль</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
